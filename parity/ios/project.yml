# The iOS half of the parity suite (parity/README.md). Compiles the iOS apps'
# own sources, read in place from the maurice and carnet repos (never
# modified), into two test bundles, and runs them on a simulator of their
# own through MauriceRunner / CarnetRunner (Runner/main.swift). Generated by scripts/parity.sh:
#   MAURICE_IOS=../maurice/app CARNET_IOS=../carnet xcodegen
name: Parity
options:
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Unit tests of the apps' own code: every type is in the same module.
    ENABLE_TESTABILITY: YES
packages:
  SwiftMath: { url: https://github.com/mgriebling/SwiftMath, from: "1.7.0" }
targetTemplates:
  Runner:
    type: application
    platform: iOS
    dependencies: [{ sdk: XCTest.framework }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Runner/Runner.entitlements
        FRAMEWORK_SEARCH_PATHS: ["$(PLATFORM_DIR)/Developer/Library/Frameworks"]
        LD_RUNPATH_SEARCH_PATHS: ["$(PLATFORM_DIR)/Developer/Library/Frameworks", "@executable_path/Frameworks"]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The apps report their version to the household (the device report).
        MARKETING_VERSION: "0.0-parity"
        CURRENT_PROJECT_VERSION: "1"

targets:
  # One runner per app: the apps read their strings from Bundle.main (L()),
  # so each runner carries its app's languages.
  MauriceRunner:
    templates: [Runner]
    sources:
      - path: Runner
      - path: ${MAURICE_IOS}/Maurice/Resources
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: eu.chezmaurice.parity.runner.maurice } }

  CarnetRunner:
    templates: [Runner]
    sources:
      - path: Runner
      - path: ${CARNET_IOS}/CarnetApp/Localizable.xcstrings
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: eu.chezmaurice.parity.runner.carnet } }

  MauriceParity:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Harness
      - path: Tests/Maurice
      - path: ${MAURICE_IOS}/Maurice
        excludes: [Info.plist, AppIcon.icon, "**/*.xcprivacy"]
      - path: ${MAURICE_IOS}/Shared
    dependencies: [{ package: SwiftMath, product: SwiftMath }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: eu.chezmaurice.parity.maurice
        PRODUCT_MODULE_NAME: MauriceParity
        MAURICE_TOWER_URL: https://account.chezmaurice.eu

  CarnetParity:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Harness
      - path: Tests/Carnet
      - path: ${CARNET_IOS}/CarnetApp
        excludes: [Info.plist, AppIcon.icon, "**/*.xcprivacy", "*.entitlements"]
      - path: ${CARNET_IOS}/Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: eu.chezmaurice.parity.carnet
        PRODUCT_MODULE_NAME: CarnetParity

schemes:
  MauriceParity: { build: { targets: { MauriceParity: [test], MauriceRunner: all } } }
  CarnetParity: { build: { targets: { CarnetParity: [test], CarnetRunner: all } } }
