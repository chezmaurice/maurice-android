# Nobody's mail address in the repository: the same check the pre-push hook
# runs (scripts/check-personal-data.py), for a push made from a machine where
# the hook is not installed. The private list of names is not here, so only
# the mail-address rule runs.
name: personal-data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-personal-data.py
